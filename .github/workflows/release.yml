name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test

      - name: Build Application
        run: pnpm run build

      - name: Package Distribution Artifacts
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/dart-server-v${{ github.ref_name }}.tar.gz -C server dist package.json
          tar -czf release-artifacts/dart-client-v${{ github.ref_name }}.tar.gz -C client dist package.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/dart-server-v${{ github.ref_name }}.tar.gz
            release-artifacts/dart-client-v${{ github.ref_name }}.tar.gz
