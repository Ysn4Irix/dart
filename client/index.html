<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L22 12H10L16 2Z' fill='%2334d399'/%3E%3Crect x='14.5' y='11' width='3' height='13' rx='0.5' fill='%2310b981'/%3E%3Cpath d='M14.5 17L8 23V28L14.5 24V17Z' fill='%23059669'/%3E%3Cpath d='M17.5 17L24 23V28L17.5 24V17Z' fill='%2334d399'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dart — Telegram File Storage</title>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('dart_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 antialiased min-h-screen transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
